---
layout: default
---
<main class="page-main"><div class="page-head"><div class="shell"><div class="section-kicker">Personal Archive</div><h1>{{ page.title }}</h1></div></div><div class="shell entry-list">{% assign selected = site.entries | where: 'category', page.category | sort: 'date' | reverse %}{% for entry in selected %}<a class="entry-link" href="{{ entry.url | relative_url }}"><h2>{{ entry.title }}</h2><time datetime="{{ entry.date | date: '%Y-%m-%d' }}">{{ entry.date | date: '%b %d, %Y' }}</time></a>{% else %}<p class="empty">No published entries yet.</p>{% endfor %}</div></main>
